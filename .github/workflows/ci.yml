name: SMT Policy Prover CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify:
    name: Run Pytest & SMT Verification Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Formal Verification Unit Tests
        run: |
          python -m pytest tests -v

      - name: Execute SMT Benchmark Suite
        run: |
          python benchmarks/run_benchmarks.py

      - name: Upload Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smt-benchmark-metrics-python-${{ matrix.python-version }}
          path: benchmarks/benchmark_metrics.json
